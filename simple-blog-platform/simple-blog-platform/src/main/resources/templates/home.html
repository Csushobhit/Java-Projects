<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Inknest</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>

<body>

<div class="wrapper">

    <div class="main-box">

        <!-- NAVBAR -->
        <header class="navbar">

            <div class="logo">INKNEST ✍️</div>

            <div class="nav-center">
                <a th:href="@{/}">HOME 🏠</a>

                <a th:href="@{/admin/posts}"
                   sec:authorize="hasRole('ADMIN')">
                   ADMIN PANEL 🔨
                </a>
            </div>

            <div class="nav-right">

                <!-- GUEST -->
                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn">LOGIN</a>
                    <a th:href="@{/register}" class="btn">REGISTER</a>
                </div>

                <!-- USER -->
                <div sec:authorize="hasRole('USER')" class="user-box">
                    <div class="avatar">👤</div>
                    <form th:action="@{/logout}" method="post">
                        <button class="btn">LOGOUT</button>
                    </form>
                </div>

                <!-- ADMIN -->
                <div sec:authorize="hasRole('ADMIN')" class="user-box">
                    <div class="avatar admin">👑</div>
                    <form th:action="@{/logout}" method="post">
                        <button class="btn">LOGOUT</button>
                    </form>
                </div>

            </div>

        </header>

        <!-- HERO -->
        <section class="hero">

            <h1 sec:authorize="!hasRole('ADMIN')">
                STOP SCROLLING NOISE.<br>
                START READING VALUE!
            </h1>

            <h1 sec:authorize="hasRole('ADMIN')">
                START WRITING.<br>
                START BEING HEARD!!
            </h1>

            <div class="search-box">
                <input type="text" name="keyword">
                <button>SEARCH</button>
            </div>

        </section>

        <!-- POSTS -->
        <section class="posts">

            <div class="grid" th:if="${postPage != null and postPage.hasContent()}">

                <div class="post-card" th:each="post : ${postPage.content}">
                    <a th:href="@{/posts/{id}(id=${post.id})}">
                        <span th:text="${post.title}">POST</span>
                    </a>
                </div>

            </div>

            <div class="empty" th:if="${postPage == null or !postPage.hasContent()}">
                No posts yet
            </div>

        </section>

    </div>

</div>

</body>
</html>
