<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create/Edit Post</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 250px;
        }

        .btn {
            padding: 10px 15px;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #007bff;
        }

        .btn-secondary {
            background-color: #6c757d;
            text-decoration: none;
            display: inline-block;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<h1 th:if="${post.id == null}">Create New Post</h1>
<h1 th:unless="${post.id == null}">Edit Post</h1>

<form th:action="@{/admin/posts}" th:object="${post}" method="post">

    <!-- Hidden ID -->
    <input type="hidden" th:field="*{id}" />

    <!-- TITLE -->
    <div class="form-group">
        <label for="title">Title</label>

        <input type="text"
               id="title"
               th:field="*{title}"
               placeholder="Enter post title"
               required
               minlength="5"
               maxlength="100" />

        <span class="error-message"
              th:if="${#fields.hasErrors('title')}"
              th:errors="*{title}">
        </span>
    </div>

    <!-- CONTENT -->
    <div class="form-group">
        <label for="content">Content</label>

        <textarea id="content"
                  th:field="*{content}"
                  placeholder="Write your post content here..."
                  required>
        </textarea>

        <span class="error-message"
              th:if="${#fields.hasErrors('content')}"
              th:errors="*{content}">
        </span>
    </div>

    <!-- BUTTONS -->
    <div class="form-group">
        <button type="submit" class="btn btn-primary">Save Post</button>
        <a th:href="@{/admin/posts}" class="btn btn-secondary">Cancel</a>
    </div>

</form>

</body>
</html>
