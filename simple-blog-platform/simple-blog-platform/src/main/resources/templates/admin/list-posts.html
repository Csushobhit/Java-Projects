<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Admin - Manage Posts</title>

    <style>
        body { font-family: sans-serif; padding: 20px; }

        h1 { margin-bottom: 20px; }

        table { width: 100%; border-collapse: collapse; }

        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }

        thead { background-color: #f2f2f2; }

        a {
            text-decoration: none;
            padding: 6px 12px;
            margin-right: 5px;
            font-size: 14px;
        }

        .btn-edit {
            background-color: #ffc107;
            color: black;
            border-radius: 4px;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            padding: 6px 10px;
        }

        .btn-create {
            background-color: #007bff;
            color: white;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .pagination {
            margin-top: 20px;
        }

        .pagination a {
            padding: 6px 10px;
            border: 1px solid #ccc;
            margin-right: 5px;
        }

        .pagination span {
            margin: 0 5px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>Post Management Dashboard</h1>

<!-- ✅ Create Button (always visible to ADMIN since route is protected) -->
<a th:href="@{/admin/posts/new}" class="btn-create">Create New Post</a>

<!-- ✅ POSTS TABLE -->
<div th:if="${postPage.hasContent()}">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Created At</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="post : ${postPage.content}">
            <td th:text="${post.id}">1</td>
            <td th:text="${post.title}">Sample Title</td>
            <td th:text="${#temporals.format(post.createdAt, 'dd-MMM-yyyy HH:mm')}">
                01-Jan-2023 10:30
            </td>

            <td>
                <a th:href="@{/admin/posts/edit/{id}(id=${post.id})}"
                   class="btn-edit">Edit</a>

                <form th:action="@{/admin/posts/delete/{id}(id=${post.id})}"
                      method="post"
                      style="display:inline;">
                    <button type="submit"
                            class="btn-delete"
                            onclick="return confirm('Are you sure you want to delete this post?');">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- ✅ EMPTY STATE -->
<div th:if="${!postPage.hasContent()}">
    <p>No posts found. Why not create one?</p>
</div>

<!-- ✅ PAGINATION -->
<div class="pagination" th:if="${postPage.totalPages > 1}">

    <!-- Previous -->
    <a th:if="${!postPage.isFirst()}"
       th:href="@{/admin/posts(page=${postPage.number - 1})}">
        ← Prev
    </a>

    <!-- Current Page -->
    <span th:text="${postPage.number + 1}"></span>

    <!-- Next -->
    <a th:if="${!postPage.isLast()}"
       th:href="@{/admin/posts(page=${postPage.number + 1})}">
        Next →
    </a>

</div>

</body>
</html>
